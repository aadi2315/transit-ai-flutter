<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="transit_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Transit AI</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Maps JavaScript API with Places and Geometry libraries -->
  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&libraries=places,geometry"></script>
  <script>
    // JS Bridge for Flutter Web to query Directions and Places Autocomplete without CORS issues
    window.transitGetDirections = function(origin, destination, waypointsJson, callback) {
      try {
        if (typeof google === 'undefined' || !google.maps || !google.maps.DirectionsService) {
          callback(JSON.stringify({ status: 'ERROR', error_message: 'Google Maps JS SDK not loaded' }));
          return;
        }
        var directionsService = new google.maps.DirectionsService();
        var waypoints = [];
        if (waypointsJson) {
          try {
            var wpArray = JSON.parse(waypointsJson);
            if (Array.isArray(wpArray)) {
              waypoints = wpArray.map(function(w) {
                return { location: w.indexOf('Ahmedabad') >= 0 ? w : (w + ', Ahmedabad, Gujarat, India'), stopover: true };
              });
            }
          } catch(e) {}
        }
        var originQuery = origin.indexOf('Ahmedabad') >= 0 ? origin : (origin + ', Ahmedabad, Gujarat, India');
        var destQuery = destination.indexOf('Ahmedabad') >= 0 ? destination : (destination + ', Ahmedabad, Gujarat, India');

        directionsService.route({
          origin: originQuery,
          destination: destQuery,
          travelMode: google.maps.TravelMode.DRIVING,
          waypoints: waypoints
        }, function(response, status) {
          if (status === google.maps.DirectionsStatus.OK && response && response.routes && response.routes.length > 0) {
            var route = response.routes[0];
            var overviewPoly = route.overview_polyline;
            if (!overviewPoly && google.maps.geometry && google.maps.geometry.encoding && route.overview_path) {
              overviewPoly = google.maps.geometry.encoding.encodePath(route.overview_path);
            }
            var legs = route.legs || [];
            var totalDist = 0;
            var totalDuration = 0;
            var steps = [];
            var startLoc = { lat: 23.0827, lng: 72.5284 };
            var endLoc = { lat: 23.0315, lng: 72.5074 };

            for (var i = 0; i < legs.length; i++) {
              var leg = legs[i];
              if (leg.distance) totalDist += leg.distance.value;
              if (leg.duration) totalDuration += leg.duration.value;
              if (i === 0 && leg.start_location) {
                startLoc = { lat: leg.start_location.lat(), lng: leg.start_location.lng() };
              }
              if (i === legs.length - 1 && leg.end_location) {
                endLoc = { lat: leg.end_location.lat(), lng: leg.end_location.lng() };
              }
              var legSteps = leg.steps || [];
              for (var j = 0; j < legSteps.length; j++) {
                var s = legSteps[j];
                var plain = (s.instructions || '').replace(/<[^>]*>?/gm, ' ').replace(/\s+/g, ' ').trim();
                steps.push({
                  instruction: plain || 'Continue along corridor',
                  distance: (s.distance && s.distance.text) ? s.distance.text : '',
                  duration: (s.duration && s.duration.text) ? s.duration.text : '',
                  start: { lat: s.start_location ? s.start_location.lat() : 0, lng: s.start_location ? s.start_location.lng() : 0 },
                  end: { lat: s.end_location ? s.end_location.lat() : 0, lng: s.end_location ? s.end_location.lng() : 0 }
                });
              }
            }

            var distKm = (totalDist / 1000.0).toFixed(1);
            var durMins = Math.round(totalDuration / 60);

            callback(JSON.stringify({
              status: 'OK',
              origin: origin,
              destination: destination,
              originLat: startLoc.lat,
              originLng: startLoc.lng,
              destLat: endLoc.lat,
              destLng: endLoc.lng,
              encodedPolyline: overviewPoly || '',
              distanceKm: parseFloat(distKm),
              durationMins: durMins,
              steps: steps
            }));
          } else {
            callback(JSON.stringify({ status: status, error_message: 'Directions request failed with ' + status }));
          }
        });
      } catch (err) {
        callback(JSON.stringify({ status: 'EXCEPTION', error_message: err.toString() }));
      }
    };

    window.transitGetPlacePredictions = function(input, callback) {
      try {
        if (typeof google === 'undefined' || !google.maps || !google.maps.places) {
          callback(JSON.stringify([]));
          return;
        }
        var service = new google.maps.places.AutocompleteService();
        service.getPlacePredictions({
          input: input,
          componentRestrictions: { country: 'in' },
          locationBias: {
            center: { lat: 23.0225, lng: 72.5714 },
            radius: 35000
          }
        }, function(predictions, status) {
          if (status === google.maps.places.PlacesServiceStatus.OK && predictions) {
            var items = predictions.map(function(p) {
              return {
                description: p.description,
                mainText: p.structured_formatting ? p.structured_formatting.main_text : p.description,
                secondaryText: p.structured_formatting ? p.structured_formatting.secondary_text : ''
              };
            });
            callback(JSON.stringify(items));
          } else {
            callback(JSON.stringify([]));
          }
        });
      } catch (err) {
        callback(JSON.stringify([]));
      }
    };

    // Live Geolocation Bridge for Transit AI
    window.transitGetCurrentLocation = function(callback) {
      try {
        if (!navigator.geolocation) {
          callback(JSON.stringify({ status: 'UNSUPPORTED' }));
          return;
        }
        navigator.geolocation.getCurrentPosition(
          function(position) {
            callback(JSON.stringify({
              status: 'OK',
              latitude: position.coords.latitude,
              longitude: position.coords.longitude,
              accuracy: position.coords.accuracy || 10,
              heading: position.coords.heading || 0,
              speed: position.coords.speed || 0,
              timestamp: position.timestamp || Date.now()
            }));
          },
          function(error) {
            callback(JSON.stringify({
              status: 'ERROR',
              code: error.code,
              message: error.message
            }));
          },
          { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 }
        );
      } catch (err) {
        callback(JSON.stringify({ status: 'EXCEPTION', message: err.toString() }));
      }
    };

    // =========================================================================
    // REAL INTERACTIVE GOOGLE MAPS ENGINE MANAGER
    // =========================================================================
    window.transitMaps = {};

    var transitDarkStyles = [
      { elementType: 'geometry', stylers: [{ color: '#0b1329' }] },
      { elementType: 'labels.text.fill', stylers: [{ color: '#94a3b8' }] },
      { elementType: 'labels.text.stroke', stylers: [{ color: '#0f172a' }] },
      { featureType: 'administrative', elementType: 'geometry', stylers: [{ color: '#1e293b' }] },
      { featureType: 'administrative.country', elementType: 'geometry.stroke', stylers: [{ color: '#334155' }] },
      { featureType: 'administrative.land_parcel', stylers: [{ visibility: 'off' }] },
      { featureType: 'administrative.locality', elementType: 'labels.text.fill', stylers: [{ color: '#38bdf8' }] },
      { featureType: 'poi', elementType: 'labels.text.fill', stylers: [{ color: '#64748b' }] },
      { featureType: 'poi.park', elementType: 'geometry', stylers: [{ color: '#0d2238' }] },
      { featureType: 'poi.park', elementType: 'labels.text.fill', stylers: [{ color: '#10b981' }] },
      { featureType: 'road', elementType: 'geometry', stylers: [{ color: '#1e293b' }] },
      { featureType: 'road', elementType: 'geometry.stroke', stylers: [{ color: '#0f172a' }] },
      { featureType: 'road', elementType: 'labels.text.fill', stylers: [{ color: '#cbd5e1' }] },
      { featureType: 'road.highway', elementType: 'geometry', stylers: [{ color: '#2563eb' }] },
      { featureType: 'road.highway', elementType: 'geometry.stroke', stylers: [{ color: '#1e3a8a' }] },
      { featureType: 'road.highway', elementType: 'labels.text.fill', stylers: [{ color: '#93c5fd' }] },
      { featureType: 'transit', elementType: 'geometry', stylers: [{ color: '#1e293b' }] },
      { featureType: 'transit.station', elementType: 'labels.text.fill', stylers: [{ color: '#00e5ff' }] },
      { featureType: 'water', elementType: 'geometry', stylers: [{ color: '#061325' }] },
      { featureType: 'water', elementType: 'labels.text.fill', stylers: [{ color: '#38bdf8' }] }
    ];

    window.transitInitMap = function(divId, isSatellite) {
      try {
        var el = document.getElementById(divId);
        if (!el || typeof google === 'undefined' || !google.maps) {
          return false;
        }

        var mapOptions = {
          center: { lat: 23.0827, lng: 72.5284 },
          zoom: 14,
          disableDefaultUI: true,
          zoomControl: false,
          gestureHandling: 'greedy',
          mapTypeId: isSatellite ? google.maps.MapTypeId.SATELLITE : google.maps.MapTypeId.ROADMAP,
          styles: isSatellite ? null : transitDarkStyles
        };

        var map = new google.maps.Map(el, mapOptions);
        window.transitMaps[divId] = {
          map: map,
          polyline: null,
          originMarker: null,
          destMarker: null,
          gpsMarker: null,
          routeBounds: null,
          isSatellite: !!isSatellite
        };
        return true;
      } catch (e) {
        console.error('[transitInitMap error]', e);
        return false;
      }
    };

    window.transitUpdateRoute = function(divId, polylineEnc, originLat, originLng, destLat, destLng) {
      try {
        var instance = window.transitMaps[divId];
        if (!instance || !instance.map) return false;
        var map = instance.map;

        // Clean up previous polyline & markers
        if (instance.polyline) {
          instance.polyline.setMap(null);
          instance.polyline = null;
        }
        if (instance.originMarker) {
          instance.originMarker.setMap(null);
          instance.originMarker = null;
        }
        if (instance.destMarker) {
          instance.destMarker.setMap(null);
          instance.destMarker = null;
        }

        if (!polylineEnc) return false;

        var decodedPath = google.maps.geometry.encoding.decodePath(polylineEnc);
        var polyline = new google.maps.Polyline({
          path: decodedPath,
          geodesic: true,
          strokeColor: '#38BDF8',
          strokeOpacity: 0.95,
          strokeWeight: 6,
          map: map
        });
        instance.polyline = polyline;

        var bounds = new google.maps.LatLngBounds();
        for (var i = 0; i < decodedPath.length; i++) {
          bounds.extend(decodedPath[i]);
        }
        instance.routeBounds = bounds;

        // Add Origin Marker (A)
        if (originLat && originLng) {
          instance.originMarker = new google.maps.Marker({
            position: { lat: originLat, lng: originLng },
            map: map,
            label: { text: 'A', color: '#ffffff', fontWeight: 'bold', fontSize: '13px' },
            icon: {
              path: google.maps.SymbolPath.BACKWARD_CLOSED_ARROW,
              scale: 6,
              fillColor: '#10B981',
              fillOpacity: 1,
              strokeColor: '#ffffff',
              strokeWeight: 2
            }
          });
        }

        // Add Destination Marker (B)
        if (destLat && destLng) {
          instance.destMarker = new google.maps.Marker({
            position: { lat: destLat, lng: destLng },
            map: map,
            label: { text: 'B', color: '#ffffff', fontWeight: 'bold', fontSize: '13px' },
            icon: {
              path: google.maps.SymbolPath.BACKWARD_CLOSED_ARROW,
              scale: 6,
              fillColor: '#F43F5E',
              fillOpacity: 1,
              strokeColor: '#ffffff',
              strokeWeight: 2
            }
          });
        }

        map.fitBounds(bounds, { top: 40, bottom: 40, left: 40, right: 40 });
        return true;
      } catch (e) {
        console.error('[transitUpdateRoute error]', e);
        return false;
      }
    };

    window.transitSetMapScope = function(divId, scope) {
      var instance = window.transitMaps[divId];
      if (!instance || !instance.map) return;
      var map = instance.map;

      if (scope === 'corridor') {
        if (instance.routeBounds) {
          map.fitBounds(instance.routeBounds, { top: 40, bottom: 40, left: 40, right: 40 });
        }
      } else if (scope === 'city') {
        map.setCenter({ lat: 23.0338, lng: 72.5850 });
        map.setZoom(12);
      } else if (scope === 'metro') {
        map.setCenter({ lat: 23.1000, lng: 72.6000 });
        map.setZoom(11);
      }
    };

    window.transitSetMapType = function(divId, isSatellite) {
      var instance = window.transitMaps[divId];
      if (!instance || !instance.map) return;
      instance.isSatellite = !!isSatellite;
      instance.map.setMapTypeId(isSatellite ? google.maps.MapTypeId.SATELLITE : google.maps.MapTypeId.ROADMAP);
      instance.map.setOptions({
        styles: isSatellite ? null : transitDarkStyles
      });
    };

    window.transitZoomMap = function(divId, delta) {
      var instance = window.transitMaps[divId];
      if (!instance || !instance.map) return;
      var currentZoom = instance.map.getZoom() || 14;
      instance.map.setZoom(currentZoom + delta);
    };

    window.transitResetMap = function(divId) {
      var instance = window.transitMaps[divId];
      if (!instance || !instance.map) return;
      if (instance.routeBounds) {
        instance.map.fitBounds(instance.routeBounds, { top: 40, bottom: 40, left: 40, right: 40 });
      } else {
        instance.map.setCenter({ lat: 23.0827, lng: 72.5284 });
        instance.map.setZoom(14);
      }
    };

    window.transitUpdateGps = function(divId, lat, lng) {
      try {
        var instance = window.transitMaps[divId];
        if (!instance || !instance.map) return;
        var map = instance.map;

        if (instance.gpsMarker) {
          instance.gpsMarker.setPosition({ lat: lat, lng: lng });
        } else {
          instance.gpsMarker = new google.maps.Marker({
            position: { lat: lat, lng: lng },
            map: map,
            icon: {
              path: google.maps.SymbolPath.CIRCLE,
              scale: 8,
              fillColor: '#00E5FF',
              fillOpacity: 1,
              strokeColor: '#ffffff',
              strokeWeight: 2.5
            },
            title: 'Your Live GPS Location'
          });
        }
      } catch (e) {}
    };

    window.transitCenterOnGps = function(divId, lat, lng) {
      var instance = window.transitMaps[divId];
      if (!instance || !instance.map) return;
      instance.map.panTo({ lat: lat, lng: lng });
      instance.map.setZoom(16);
    };
  </script>
</head>
<body>
  <!--

</body>
</html>
