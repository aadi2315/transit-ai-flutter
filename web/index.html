  <!-- Dynamic Google Maps JavaScript SDK loader (Keys loaded safely from .env / AppEnv) -->
  <script>
    window.loadGoogleMapsSdk = function(apiKey) {
      if (!apiKey || apiKey.indexOf('YOUR_') >= 0 || window.isGoogleMapsScriptInjected) return;
      window.isGoogleMapsScriptInjected = true;
      var script = document.createElement('script');
      script.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(apiKey) + '&libraries=places,geometry';
      script.async = true;
      document.head.appendChild(script);
    };
  </script>
  <!-- Clean, professional Google Maps embedded styling -->
  <style>
    .gm-style-cc,
    .gmnoprint a,
    .gmnoprint span,
    a[href^="https://maps.google.com/maps"],
    a[href^="https://www.google.com/maps"] {
      display: none !important;
    }
  </style>
  <script>
    window.transitLastGps = { lat: 23.0827, lng: 72.5284 };

    function transitFormatEndpoint(val) {
      if (!val) return 'Ahmedabad, Gujarat, India';
      if (typeof val === 'object' && val.lat && val.lng) {
        return new google.maps.LatLng(val.lat, val.lng);
      }
      var s = String(val).trim();
      // 1. Check if coordinate format e.g. "23.0827,72.5284" or "23.0827, 72.5284"
      var coordMatch = s.match(/^(-?\d+(\.\d+)?)\s*,\s*(-?\d+(\.\d+)?)$/);
      if (coordMatch) {
        return new google.maps.LatLng(parseFloat(coordMatch[1]), parseFloat(coordMatch[3]));
      }
      // 2. Check if Current Location string reached here
      var low = s.toLowerCase();
      if (low.indexOf('current location') >= 0 || low.indexOf('live gps') >= 0 || low === 'my location' || low === 'gps') {
        if (window.transitLastGps && window.transitLastGps.lat) {
          return new google.maps.LatLng(window.transitLastGps.lat, window.transitLastGps.lng);
        }
      }
      // 3. Clean parenthetical annotations like "(BRTS Hub)", "(Live GPS)", etc.
      var clean = s.replace(/\s*\([^)]*\)/g, '').trim();
      if (!clean) return 'Ahmedabad, Gujarat, India';

      var cleanLow = clean.toLowerCase();
      // If it already has comma, state, country or specific city name, use directly
      if (cleanLow.indexOf(',') >= 0 ||
          cleanLow.indexOf('gujarat') >= 0 ||
          cleanLow.indexOf('india') >= 0 ||
          cleanLow.indexOf('ahmedabad') >= 0 ||
          cleanLow.indexOf('gandhinagar') >= 0 ||
          cleanLow.indexOf('mumbai') >= 0 ||
          cleanLow.indexOf('delhi') >= 0 ||
          cleanLow.indexOf('surat') >= 0 ||
          cleanLow.indexOf('vadodara') >= 0) {
        return clean;
      }
      // Default to Ahmedabad, Gujarat, India for local stop names
      return clean + ', Ahmedabad, Gujarat, India';
    }

    // JS Bridge for Flutter Web to query Directions and Places Autocomplete without CORS issues
    window.transitGetDirections = function(origin, destination, waypointsJson, callback) {
      try {
        if (typeof google === 'undefined' || !google.maps || !google.maps.DirectionsService) {
          callback(JSON.stringify({ status: 'ERROR', error_message: 'Google Maps JS SDK not loaded' }));
          return;
        }
        var directionsService = new google.maps.DirectionsService();
        var waypoints = [];
        if (waypointsJson) {
          try {
            var wpArray = JSON.parse(waypointsJson);
            if (Array.isArray(wpArray)) {
              waypoints = wpArray.map(function(w) {
                return { location: transitFormatEndpoint(w), stopover: true };
              });
            }
          } catch(e) {}
        }

        function executeRoute(origEndpoint, destEndpoint, fallbackAttempt) {
          directionsService.route({
            origin: origEndpoint,
            destination: destEndpoint,
            travelMode: google.maps.TravelMode.DRIVING,
            waypoints: waypoints
          }, function(response, status) {
            if (status === google.maps.DirectionsStatus.OK && response && response.routes && response.routes.length > 0) {
              var route = response.routes[0];
              var overviewPoly = route.overview_polyline;
              if (!overviewPoly && google.maps.geometry && google.maps.geometry.encoding && route.overview_path) {
                overviewPoly = google.maps.geometry.encoding.encodePath(route.overview_path);
              }
              var legs = route.legs || [];
              var totalDist = 0;
              var totalDuration = 0;
              var steps = [];
              var startLoc = { lat: 23.0827, lng: 72.5284 };
              var endLoc = { lat: 23.0315, lng: 72.5074 };

              for (var i = 0; i < legs.length; i++) {
                var leg = legs[i];
                if (leg.distance) totalDist += leg.distance.value;
                if (leg.duration) totalDuration += leg.duration.value;
                if (i === 0 && leg.start_location) {
                  startLoc = { lat: leg.start_location.lat(), lng: leg.start_location.lng() };
                }
                if (i === legs.length - 1 && leg.end_location) {
                  endLoc = { lat: leg.end_location.lat(), lng: leg.end_location.lng() };
                }
                var legSteps = leg.steps || [];
                for (var j = 0; j < legSteps.length; j++) {
                  var s = legSteps[j];
                  var plain = (s.instructions || '').replace(/<[^>]*>?/gm, ' ').replace(/\s+/g, ' ').trim();
                  steps.push({
                    instruction: plain || 'Continue along corridor',
                    distance: (s.distance && s.distance.text) ? s.distance.text : '',
                    duration: (s.duration && s.duration.text) ? s.duration.text : '',
                    start: { lat: s.start_location ? s.start_location.lat() : 0, lng: s.start_location ? s.start_location.lng() : 0 },
                    end: { lat: s.end_location ? s.end_location.lat() : 0, lng: s.end_location ? s.end_location.lng() : 0 }
                  });
                }
              }

              var distKm = (totalDist / 1000.0).toFixed(1);
              var durMins = Math.round(totalDuration / 60);

              callback(JSON.stringify({
                status: 'OK',
                origin: origin,
                destination: destination,
                originLat: startLoc.lat,
                originLng: startLoc.lng,
                destLat: endLoc.lat,
                destLng: endLoc.lng,
                encodedPolyline: overviewPoly || '',
                distanceKm: parseFloat(distKm),
                durationMins: durMins,
                steps: steps
              }));
            } else if (fallbackAttempt === 1) {
              // Retry with raw cleaned queries without forced city suffix
              var cleanOrig = typeof origin === 'string' ? origin.replace(/\s*\([^)]*\)/g, '').trim() : origEndpoint;
              var cleanDest = typeof destination === 'string' ? destination.replace(/\s*\([^)]*\)/g, '').trim() : destEndpoint;
              executeRoute(cleanOrig, cleanDest, 2);
            } else {
              callback(JSON.stringify({ status: status, error_message: 'Directions request failed with ' + status }));
            }
          });
        }

        executeRoute(transitFormatEndpoint(origin), transitFormatEndpoint(destination), 1);
      } catch (err) {
        callback(JSON.stringify({ status: 'EXCEPTION', error_message: err.toString() }));
      }
    };

    window.transitGetPlacePredictions = function(input, callback) {
      try {
        if (typeof google === 'undefined' || !google.maps || !google.maps.places) {
          callback(JSON.stringify([]));
          return;
        }
        var service = new google.maps.places.AutocompleteService();
        service.getPlacePredictions({
          input: input,
          componentRestrictions: { country: 'in' },
          locationBias: {
            center: { lat: 23.0225, lng: 72.5714 },
            radius: 35000
          }
        }, function(predictions, status) {
          if (status === google.maps.places.PlacesServiceStatus.OK && predictions) {
            var items = predictions.map(function(p) {
              return {
                description: p.description,
                mainText: p.structured_formatting ? p.structured_formatting.main_text : p.description,
                secondaryText: p.structured_formatting ? p.structured_formatting.secondary_text : ''
              };
            });
            callback(JSON.stringify(items));
          } else {
            callback(JSON.stringify([]));
          }
        });
      } catch (err) {
        callback(JSON.stringify([]));
      }
    };

    // Live Geolocation Bridge for Transit AI
    window.transitGetCurrentLocation = function(callback) {
      try {
        if (!navigator.geolocation) {
          callback(JSON.stringify({ status: 'UNSUPPORTED' }));
          return;
        }
        navigator.geolocation.getCurrentPosition(
          function(position) {
            window.transitLastGps = { lat: position.coords.latitude, lng: position.coords.longitude };
            callback(JSON.stringify({
              status: 'OK',
              latitude: position.coords.latitude,
              longitude: position.coords.longitude,
              accuracy: position.coords.accuracy || 10,
              heading: position.coords.heading || 0,
              speed: position.coords.speed || 0,
              timestamp: position.timestamp || Date.now()
            }));
          },
          function(error) {
            callback(JSON.stringify({
              status: 'ERROR',
              code: error.code,
              message: error.message
            }));
          },
          { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 }
        );
      } catch (err) {
        callback(JSON.stringify({ status: 'EXCEPTION', message: err.toString() }));
      }
    };

    // =========================================================================
    // REAL INTERACTIVE GOOGLE MAPS ENGINE MANAGER
    // =========================================================================
    window.transitMaps = {};
    window.transitDomElements = {};

    // Mathematical route focus and zoom calculator:
    // Calculates the true midpoint and optimal zoom from degree span so the map
    // centers on the actual route immediately, completely immune to zero-dimension containers.
    window.transitApplyRouteFocus = function(instance, bounds, minLat, maxLat, minLng, maxLng) {
      if (!instance || !instance.map) return;
      var map = instance.map;

      var centerLat = (minLat + maxLat) / 2;
      var centerLng = (minLng + maxLng) / 2;
      var spanLat = Math.max(Math.abs(maxLat - minLat), 0.005);
      var spanLng = Math.max(Math.abs(maxLng - minLng), 0.005);
      var maxSpan = Math.max(spanLat, spanLng);

      // Compute exact zoom from bounding degree span
      var zoom = 14;
      if (maxSpan > 10.0) zoom = 5;
      else if (maxSpan > 5.0) zoom = 6;
      else if (maxSpan > 2.5) zoom = 7;
      else if (maxSpan > 1.2) zoom = 8;
      else if (maxSpan > 0.6) zoom = 9;
      else if (maxSpan > 0.3) zoom = 11;
      else if (maxSpan > 0.15) zoom = 12;
      else if (maxSpan > 0.07) zoom = 13;
      else if (maxSpan > 0.035) zoom = 14;
      else zoom = 15;

      instance.routeBounds = bounds;
      instance.routeCenter = { lat: centerLat, lng: centerLng };
      instance.routeZoom = zoom;
      instance.minLat = minLat;
      instance.maxLat = maxLat;
      instance.minLng = minLng;
      instance.maxLng = maxLng;
      instance.hasRoute = true;

      // 1. Immediately focus onto the exact route center & zoom level
      map.setCenter({ lat: centerLat, lng: centerLng });
      map.setZoom(zoom);
      google.maps.event.trigger(map, 'resize');

      // 2. Refine with fitBounds once layout is established
      setTimeout(function() {
        try {
          google.maps.event.trigger(map, 'resize');
          var div = map.getDiv();
          if (div && div.offsetWidth > 100 && div.offsetHeight > 80 && bounds && !bounds.isEmpty()) {
            map.fitBounds(bounds, { top: 25, bottom: 25, left: 25, right: 25 });
            // Guard against world-zoom/Russia fallback
            setTimeout(function() {
              try {
                var z = map.getZoom();
                if ((z < 10 && maxSpan < 0.1) || z < 3) {
                  map.setCenter({ lat: centerLat, lng: centerLng });
                  map.setZoom(zoom);
                }
              } catch(e) {}
            }, 60);
          }
        } catch(e) {}
      }, 120);
    };

    // Get active map or initialize a fresh one on the currently attached DOM element.
    // Automatically re-attaches if Flutter Web recreated the platform view div!
    window.transitGetOrInitMap = function(divId, isSatellite) {
      if (typeof google === 'undefined' || !google.maps) return null;
      var el = (window.transitDomElements && window.transitDomElements[divId]) || document.getElementById(divId);
      if (!el) {
        // Deep search inside Flutter glass-pane shadow roots
        var all = document.querySelectorAll('*');
        for (var i = 0; i < all.length; i++) {
          if (all[i].shadowRoot) {
            var found = all[i].shadowRoot.getElementById(divId) || all[i].shadowRoot.querySelector('#' + divId);
            if (found) { el = found; break; }
          }
        }
      }
      if (!el) return null;

      var instance = window.transitMaps[divId];
      // If map already exists AND is attached to this exact DOM element that is still connected
      if (instance && instance.map && instance.map.getDiv() === el && document.contains(el)) {
        return instance;
      }

      // Re-create or initialize on el
      try {
        if (instance && instance.resizeObserver) {
          try { instance.resizeObserver.disconnect(); } catch(e) {}
        }

        var mapOptions = {
          center: (instance && instance.routeCenter) ? instance.routeCenter : { lat: 23.0827, lng: 72.5284 },
          zoom: (instance && instance.routeZoom) ? instance.routeZoom : 14,
          minZoom: 3,
          maxZoom: 20,
          disableDefaultUI: true,
          zoomControl: false,
          gestureHandling: 'greedy',
          mapTypeId: isSatellite ? google.maps.MapTypeId.SATELLITE : google.maps.MapTypeId.ROADMAP,
          styles: null
        };

        var map = new google.maps.Map(el, mapOptions);

        instance = {
          map: map,
          polyline: null,
          originMarker: null,
          destMarker: null,
          gpsMarker: null,
          transitPolylines: [],
          transitMarkers: [],
          routeBounds: (instance && instance.routeBounds) || null,
          routeCenter: (instance && instance.routeCenter) || null,
          routeZoom: (instance && instance.routeZoom) || null,
          minLat: (instance && instance.minLat) || null,
          maxLat: (instance && instance.maxLat) || null,
          minLng: (instance && instance.minLng) || null,
          maxLng: (instance && instance.maxLng) || null,
          hasRoute: false,
          isSatellite: !!isSatellite,
          resizeObserver: null,
          cachedTransitArgs: (instance && instance.cachedTransitArgs) || null,
          cachedDrivingArgs: (instance && instance.cachedDrivingArgs) || null
        };
        window.transitMaps[divId] = instance;

        if (window.ResizeObserver) {
          var ro = new ResizeObserver(function(entries) {
            for (var i = 0; i < entries.length; i++) {
              var entry = entries[i];
              if (entry.contentRect && entry.contentRect.width > 0 && entry.contentRect.height > 0) {
                google.maps.event.trigger(map, 'resize');
              }
            }
          });
          ro.observe(el);
          instance.resizeObserver = ro;
        }

        // Staggered resize triggers to guarantee smooth tile loading
        setTimeout(function() { google.maps.event.trigger(map, 'resize'); }, 60);
        setTimeout(function() { google.maps.event.trigger(map, 'resize'); }, 180);

        // Re-render cached route onto newly mounted div if available
        if (instance.cachedTransitArgs) {
          var ca = instance.cachedTransitArgs;
          setTimeout(function() {
            window.transitUpdateTransitRoute(divId, ca.legsJson, ca.oLat, ca.oLng, ca.dLat, ca.dLng);
          }, 60);
        } else if (instance.cachedDrivingArgs) {
          var da = instance.cachedDrivingArgs;
          setTimeout(function() {
            window.transitUpdateRoute(divId, da.polyEnc, da.oLat, da.oLng, da.dLat, da.dLng);
          }, 60);
        }

        return instance;
      } catch(e) {
        console.error('[transitGetOrInitMap error]', e);
        return null;
      }
    };

    window.transitRegisterElement = function(id, el) {
      window.transitDomElements[id] = el;
      var instance = window.transitMaps[id];
      if (!instance || !instance.map || instance.map.getDiv() !== el) {
        window.transitGetOrInitMap(id, instance ? instance.isSatellite : false);
      } else {
        google.maps.event.trigger(instance.map, 'resize');
      }
    };

    window.transitInitMap = function(divId, isSatellite) {
      return !!window.transitGetOrInitMap(divId, isSatellite);
    };

    window.transitUpdateRoute = function(divId, polylineEnc, originLat, originLng, destLat, destLng) {
      try {
        var instance = window.transitGetOrInitMap(divId);
        if (!instance || !instance.map) return false;
        var map = instance.map;
        google.maps.event.trigger(map, 'resize');

        instance.cachedDrivingArgs = {
          polyEnc: polylineEnc,
          oLat: originLat,
          oLng: originLng,
          dLat: destLat,
          dLng: destLng
        };
        instance.cachedTransitArgs = null;

        // Clean up previous polyline & markers
        if (instance.polyline) { instance.polyline.setMap(null); instance.polyline = null; }
        if (instance.originMarker) { instance.originMarker.setMap(null); instance.originMarker = null; }
        if (instance.destMarker) { instance.destMarker.setMap(null); instance.destMarker = null; }
        (instance.transitPolylines || []).forEach(function(p) { p.setMap(null); });
        (instance.transitMarkers || []).forEach(function(m) { m.setMap(null); });
        instance.transitPolylines = [];
        instance.transitMarkers = [];

        var bounds = new google.maps.LatLngBounds();
        var hasPath = false;
        var minLat = 999, maxLat = -999, minLng = 999, maxLng = -999;
        function trackPt(lat, lng) {
          if (!lat || !lng) return;
          if (lat < minLat) minLat = lat;
          if (lat > maxLat) maxLat = lat;
          if (lng < minLng) minLng = lng;
          if (lng > maxLng) maxLng = lng;
        }

        if (polylineEnc) {
          try {
            var decodedPath = google.maps.geometry.encoding.decodePath(polylineEnc);
            if (decodedPath && decodedPath.length > 0) {
              var polyline = new google.maps.Polyline({
                path: decodedPath,
                geodesic: true,
                strokeColor: '#2563EB',
                strokeOpacity: 0.95,
                strokeWeight: 6,
                zIndex: 60,
                map: map
              });
              instance.polyline = polyline;
              for (var i = 0; i < decodedPath.length; i++) {
                bounds.extend(decodedPath[i]);
                trackPt(decodedPath[i].lat(), decodedPath[i].lng());
              }
              hasPath = true;
            }
          } catch(e) {}
        }

        var oLat = (originLat && originLat !== 0) ? originLat : 23.086257;
        var oLng = (originLng && originLng !== 0) ? originLng : 72.528383;
        var dLat = (destLat && destLat !== 0) ? destLat : 23.064879;
        var dLng = (destLng && destLng !== 0) ? destLng : 72.529577;

        var originPt = new google.maps.LatLng(oLat, oLng);
        var destPt = new google.maps.LatLng(dLat, dLng);
        bounds.extend(originPt);
        bounds.extend(destPt);
        trackPt(oLat, oLng);
        trackPt(dLat, dLng);

        if (!hasPath) {
          var straightPoly = new google.maps.Polyline({
            path: [originPt, destPt],
            geodesic: true,
            strokeColor: '#2563EB',
            strokeOpacity: 0.95,
            strokeWeight: 6,
            zIndex: 60,
            map: map
          });
          instance.polyline = straightPoly;
        }

        // Origin marker
        var originPinIcon = {
          url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">' +
            '<circle fill="#FFFFFF" cx="14" cy="14" r="11" stroke="#334155" stroke-width="4"/>' +
            '<circle fill="#10B981" cx="14" cy="14" r="6"/>' +
            '</svg>'
          ),
          scaledSize: new google.maps.Size(28, 28),
          anchor: new google.maps.Point(14, 14)
        };
        instance.originMarker = new google.maps.Marker({
          position: originPt,
          map: map,
          icon: originPinIcon,
          zIndex: 200,
          title: 'Origin Stop'
        });

        // Destination Red Pin Drop
        var destPinSvg = '<svg xmlns="http://www.w3.org/2000/svg" width="38" height="52" viewBox="0 0 38 52">' +
          '<filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/></filter>' +
          '<g filter="url(#sh)">' +
          '<path fill="#EA4335" stroke="#B31412" stroke-width="1.2" d="M19 1C9.61 1 2 8.61 2 18c0 12.8 17 31 17 31s17-18.2 17-31C36 8.61 28.39 1 19 1z"/>' +
          '<circle fill="#FFFFFF" cx="19" cy="18" r="6.5"/>' +
          '</g></svg>';
        var destPinIcon = {
          url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(destPinSvg),
          scaledSize: new google.maps.Size(34, 48),
          anchor: new google.maps.Point(17, 47)
        };
        instance.destMarker = new google.maps.Marker({
          position: destPt,
          map: map,
          icon: destPinIcon,
          zIndex: 200,
          title: 'Destination Stop'
        });

        if (minLat === 999) {
          minLat = Math.min(oLat, dLat);
          maxLat = Math.max(oLat, dLat);
          minLng = Math.min(oLng, dLng);
          maxLng = Math.max(oLng, dLng);
        }

        // Focus & zoom immediately to this route
        window.transitApplyRouteFocus(instance, bounds, minLat, maxLat, minLng, maxLng);
        return true;
      } catch (e) {
        console.error('[transitUpdateRoute error]', e);
        return false;
      }
    };

    window.transitZoomToRoute = function(divId, oLat, oLng, dLat, dLng) {
      var instance = window.transitGetOrInitMap(divId);
      if (!instance || !instance.map) return;
      window.transitResetMap(divId);
    };

    // Multi-Leg Transit Route Renderer (Bus Lines with Bus Badges & Stop Markers)
    window.transitUpdateTransitRoute = function(divId, legsJson, originLat, originLng, destLat, destLng) {
      try {
        var instance = window.transitGetOrInitMap(divId);
        if (!instance || !instance.map) return false;
        var map = instance.map;
        google.maps.event.trigger(map, 'resize');

        instance.cachedTransitArgs = {
          legsJson: legsJson,
          oLat: originLat,
          oLng: originLng,
          dLat: destLat,
          dLng: destLng
        };
        instance.cachedDrivingArgs = null;

        // Clear previous overlays
        if (instance.polyline) { instance.polyline.setMap(null); instance.polyline = null; }
        if (instance.originMarker) { instance.originMarker.setMap(null); instance.originMarker = null; }
        if (instance.destMarker) { instance.destMarker.setMap(null); instance.destMarker = null; }
        (instance.transitPolylines || []).forEach(function(p) { p.setMap(null); });
        (instance.transitMarkers || []).forEach(function(m) { m.setMap(null); });
        instance.transitPolylines = [];
        instance.transitMarkers = [];

        var legs;
        try { legs = JSON.parse(legsJson); } catch(e) { return false; }
        if (!legs || !legs.length) return false;

        var bounds = new google.maps.LatLngBounds();
        var legColors = ['#1A73E8','#EA4335','#34A853','#FBBC05','#9B59B6'];
        var minLat = 999, maxLat = -999, minLng = 999, maxLng = -999;
        function trackPt(lat, lng) {
          if (!lat || !lng) return;
          if (lat < minLat) minLat = lat;
          if (lat > maxLat) maxLat = lat;
          if (lng < minLng) minLng = lng;
          if (lng > maxLng) maxLng = lng;
        }

        legs.forEach(function(leg, idx) {
          var color = leg.color || legColors[idx % legColors.length];
          var drawn = false;

          // 1. Draw polyline for this leg
          if (leg.polylineEnc) {
            try {
              var path = google.maps.geometry.encoding.decodePath(leg.polylineEnc);
              if (path && path.length > 0) {
                var poly = new google.maps.Polyline({
                  path: path,
                  geodesic: true,
                  strokeColor: color,
                  strokeOpacity: 0.95,
                  strokeWeight: 6,
                  zIndex: 60 + idx * 5,
                  map: map
                });
                instance.transitPolylines.push(poly);
                path.forEach(function(pt) {
                  bounds.extend(pt);
                  trackPt(pt.lat(), pt.lng());
                });
                drawn = true;
              }
            } catch(e) {}
          }

          if (!drawn && leg.boardLat && leg.alightLat) {
            var straight = [
              new google.maps.LatLng(leg.boardLat, leg.boardLng),
              new google.maps.LatLng(leg.alightLat, leg.alightLng)
            ];
            var polyFallback = new google.maps.Polyline({
              path: straight,
              geodesic: true,
              strokeColor: color,
              strokeOpacity: 0.95,
              strokeWeight: 6,
              zIndex: 60 + idx * 5,
              map: map
            });
            instance.transitPolylines.push(polyFallback);
            bounds.extend(straight[0]);
            bounds.extend(straight[1]);
            trackPt(leg.boardLat, leg.boardLng);
            trackPt(leg.alightLat, leg.alightLng);
          }

          // 2. Board marker (First stop of this leg with Bus Badge)
          if (leg.boardLat && leg.boardLng) {
            var isTransferBoard = leg.isTransfer === true;
            var busLabel = leg.busNumber ? String(leg.busNumber) : 'BUS';
            var boardIcon = {
              url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(
                '<svg xmlns="http://www.w3.org/2000/svg" width="52" height="26" viewBox="0 0 52 26">' +
                '<rect rx="13" width="52" height="26" fill="' + color + '" stroke="#FFFFFF" stroke-width="2"/>' +
                '<text x="26" y="17" font-family="sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">' + busLabel + '</text>' +
                '</svg>'
              ),
              scaledSize: new google.maps.Size(52, 26),
              anchor: new google.maps.Point(26, 13)
            };
            var boardMarker = new google.maps.Marker({
              position: { lat: leg.boardLat, lng: leg.boardLng },
              map: map,
              icon: boardIcon,
              zIndex: 120 + idx * 10,
              title: (leg.boardName || 'Board') + (isTransferBoard ? ' [Transfer]' : '')
            });
            instance.transitMarkers.push(boardMarker);
            bounds.extend(new google.maps.LatLng(leg.boardLat, leg.boardLng));
            trackPt(leg.boardLat, leg.boardLng);
          }

          // 3. Alight / Transfer marker
          if (idx === legs.length - 1 && leg.alightLat && leg.alightLng) {
            // Destination Red Pin Drop
            var destPinSvg = '<svg xmlns="http://www.w3.org/2000/svg" width="38" height="52" viewBox="0 0 38 52">' +
              '<filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/></filter>' +
              '<g filter="url(#sh)">' +
              '<path fill="#EA4335" stroke="#B31412" stroke-width="1.2" d="M19 1C9.61 1 2 8.61 2 18c0 12.8 17 31 17 31s17-18.2 17-31C36 8.61 28.39 1 19 1z"/>' +
              '<circle fill="#FFFFFF" cx="19" cy="18" r="6.5"/>' +
              '</g></svg>';
            var alightIcon = {
              url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(destPinSvg),
              scaledSize: new google.maps.Size(34, 48),
              anchor: new google.maps.Point(17, 47)
            };
            var alightMarker = new google.maps.Marker({
              position: { lat: leg.alightLat, lng: leg.alightLng },
              map: map,
              icon: alightIcon,
              zIndex: 200,
              title: leg.alightName || 'Destination'
            });
            instance.transitMarkers.push(alightMarker);
            bounds.extend(new google.maps.LatLng(leg.alightLat, leg.alightLng));
            trackPt(leg.alightLat, leg.alightLng);
          } else if (leg.isTransfer && leg.alightLat && leg.alightLng) {
            var transferIcon = {
              url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(
                '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">' +
                '<circle fill="#FFFFFF" cx="16" cy="16" r="14" stroke="#FF8C00" stroke-width="3"/>' +
                '<text x="16" y="21" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FF8C00" text-anchor="middle">&#x21C4;</text>' +
                '</svg>'
              ),
              scaledSize: new google.maps.Size(32, 32),
              anchor: new google.maps.Point(16, 16)
            };
            var transferMarker = new google.maps.Marker({
              position: { lat: leg.alightLat, lng: leg.alightLng },
              map: map,
              icon: transferIcon,
              zIndex: 160 + idx * 10,
              title: (leg.alightName || 'Transfer') + ' — Transfer Point'
            });
            instance.transitMarkers.push(transferMarker);
            bounds.extend(new google.maps.LatLng(leg.alightLat, leg.alightLng));
            trackPt(leg.alightLat, leg.alightLng);
          }
        });

        if (originLat && originLng) trackPt(originLat, originLng);
        if (destLat && destLng) trackPt(destLat, destLng);

        if (minLat === 999) {
          minLat = 23.038; maxLat = 23.086;
          minLng = 72.528; maxLng = 72.538;
        }

        window.transitApplyRouteFocus(instance, bounds, minLat, maxLat, minLng, maxLng);
        return true;
      } catch (e) {
        console.error('[transitUpdateTransitRoute error]', e);
        return false;
      }
    };

    window.transitClearRoute = function(divId) {
      var instance = window.transitGetOrInitMap(divId);
      if (!instance) return;
      if (instance.polyline) { instance.polyline.setMap(null); instance.polyline = null; }
      if (instance.originMarker) { instance.originMarker.setMap(null); instance.originMarker = null; }
      if (instance.destMarker) { instance.destMarker.setMap(null); instance.destMarker = null; }
      (instance.transitPolylines || []).forEach(function(p) { p.setMap(null); });
      (instance.transitMarkers || []).forEach(function(m) { m.setMap(null); });
      instance.transitPolylines = [];
      instance.transitMarkers = [];
      instance.routeBounds = null;
      instance.routeCenter = null;
      instance.routeZoom = null;
      instance.cachedTransitArgs = null;
      instance.cachedDrivingArgs = null;
    };

    window.transitSetMapScope = function(divId, scope) {
      var instance = window.transitGetOrInitMap(divId);
      if (!instance || !instance.map) return;
      var map = instance.map;
      google.maps.event.trigger(map, 'resize');

      if (scope === 'corridor' || scope === 'Route') {
        window.transitResetMap(divId);
      } else if (scope === 'city' || scope === 'City Grid') {
        if (instance.routeCenter) {
          map.setCenter(instance.routeCenter);
          map.setZoom(12);
        } else {
          map.setCenter({ lat: 23.0750, lng: 72.5250 });
          map.setZoom(12);
        }
      }
    };

    window.transitSetMapType = function(divId, isSatellite) {
      var instance = window.transitGetOrInitMap(divId, isSatellite);
      if (!instance || !instance.map) return;
      instance.isSatellite = !!isSatellite;
      instance.map.setMapTypeId(isSatellite ? google.maps.MapTypeId.SATELLITE : google.maps.MapTypeId.ROADMAP);
    };

    window.transitZoomMap = function(divId, delta) {
      var instance = window.transitGetOrInitMap(divId);
      if (!instance || !instance.map) return;
      var currentZoom = instance.map.getZoom() || 14;
      var targetZoom = currentZoom + delta;
      if (targetZoom < 3) targetZoom = 3;
      if (targetZoom > 20) targetZoom = 20;
      instance.map.setZoom(targetZoom);
    };

    // Recenter Button: Always re-focuses on the current route center & zoom level
    window.transitResetMap = function(divId) {
      var instance = window.transitGetOrInitMap(divId);
      if (!instance || !instance.map) return;
      var map = instance.map;
      google.maps.event.trigger(map, 'resize');

      if (instance.routeCenter && instance.routeZoom) {
        map.setCenter(instance.routeCenter);
        map.setZoom(instance.routeZoom);
        if (instance.routeBounds && !instance.routeBounds.isEmpty()) {
          try {
            map.fitBounds(instance.routeBounds, { top: 25, bottom: 25, left: 25, right: 25 });
            setTimeout(function() {
              var z = map.getZoom();
              if (z < 10 && instance.routeZoom >= 12) {
                map.setCenter(instance.routeCenter);
                map.setZoom(instance.routeZoom);
              }
            }, 60);
          } catch(e) {}
        }
      } else if (instance.routeBounds && !instance.routeBounds.isEmpty()) {
        try {
          map.fitBounds(instance.routeBounds, { top: 25, bottom: 25, left: 25, right: 25 });
        } catch(e) {
          map.setCenter({ lat: 23.0827, lng: 72.5284 });
          map.setZoom(14);
        }
      } else {
        map.setCenter({ lat: 23.0827, lng: 72.5284 });
        map.setZoom(14);
      }
    };

    window.transitUpdateGps = function(divId, lat, lng) {
      try {
        window.transitLastGps = { lat: lat, lng: lng };
        var instance = window.transitGetOrInitMap(divId);
        if (!instance || !instance.map) return;
        var map = instance.map;

        var liveGpsIcon = {
          url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">' +
            '<circle fill="#4285F4" fill-opacity="0.25" cx="14" cy="14" r="13"/>' +
            '<circle fill="#FFFFFF" cx="14" cy="14" r="7" stroke="#1A73E8" stroke-width="2.5"/>' +
            '<circle fill="#1A73E8" cx="14" cy="14" r="4.5"/>' +
            '</svg>'
          ),
          scaledSize: new google.maps.Size(26, 26),
          anchor: new google.maps.Point(13, 13)
        };

        if (instance.gpsMarker) {
          instance.gpsMarker.setPosition({ lat: lat, lng: lng });
        } else {
          instance.gpsMarker = new google.maps.Marker({
            position: { lat: lat, lng: lng },
            map: map,
            icon: liveGpsIcon,
            title: 'Your Live GPS Location'
          });
        }
      } catch (e) {}
    };

    window.transitCenterOnGps = function(divId, lat, lng) {
      var instance = window.transitGetOrInitMap(divId);
      if (!instance || !instance.map) return;
      instance.map.panTo({ lat: lat, lng: lng });
      instance.map.setZoom(16);
    };
  </script>
